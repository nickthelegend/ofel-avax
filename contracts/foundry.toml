[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 256

[rpc_endpoints]
ofel_local = "${OFEL_L1_RPC}"
fuji = "https://api.avax-test.network/ext/bc/C/rpc"

[lint]
lint_on_build = false
