# Ofel L1 on Fuji: three avalanchego validators on the hackathon VPS, behind Coolify's Traefik (network "coolify").
# Layout on the server: /opt/hk/ofel-l1/{docker-compose.yml,.env,configs/,v1/,v2/,v3/}
#   configs/plugins/<VMID>                 Subnet-EVM plugin binary (same release as avalanchego)
#   configs/chains/<blockchainID>/config.json   = deployments/l1-chain-config.fuji.json
#   configs/subnets/<subnetID>.json             = deployments/l1-subnet-config.json (k=3, alpha=2)
# .env (not secret) sets OFEL_SUBNET_ID and OFEL_CHAIN_ID once the L1 exists; before that the nodes only sync the P-Chain.
# Each node keeps its own staking/BLS keys in vN/staking (generated by avalanchego on first start, never copied anywhere).
# HTTP is never published on the host (so allowed-hosts is "*"; viper does not split env lists): Traefik serves only
# /ext/info, /ext/health and the Ofel L1 rpc/ws over TLS.
# Staking ports 9651/9653/9655 are published for peer-to-peer traffic (UFW allows them).
# configs/chains/P/config.json = deployments/pchain-config.vps.json (smaller P-Chain caches).
# The agent service (profile "agent") builds from ./app, a git archive of the ofel repo; its key is in .env.agent.
x-node: &node
  image: avaplatform/avalanchego:v1.15.3
  restart: unless-stopped
  networks: [coolify]
  mem_limit: ${OFEL_NODE_MEM:-900m}
  memswap_limit: ${OFEL_NODE_MEMSWAP:-1200m}
  cpus: ${OFEL_NODE_CPUS:-0.6}
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9650 && printf 'GET /ext/health/liveness HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 120s

x-env: &env
  GOMEMLIMIT: "${OFEL_NODE_GOMEMLIMIT:-700MiB}"
  AVAGO_NETWORK_ID: fuji
  AVAGO_PARTIAL_SYNC_PRIMARY_NETWORK: "true"
  AVAGO_PUBLIC_IP: 201.18.198.162
  AVAGO_HTTP_HOST: 0.0.0.0
  AVAGO_HTTP_PORT: "9650"
  AVAGO_HTTP_ALLOWED_ORIGINS: "*"
  AVAGO_API_ADMIN_ENABLED: "false"
  AVAGO_API_METRICS_ENABLED: "false"
  AVAGO_INDEX_ENABLED: "false"
  AVAGO_TRACK_SUBNETS: "${OFEL_SUBNET_ID:-}"
  AVAGO_PLUGIN_DIR: /configs/plugins
  AVAGO_CHAIN_CONFIG_DIR: /configs/chains
  AVAGO_SUBNET_CONFIG_DIR: /configs/subnets
  AVAGO_LOG_ROTATER_MAX_SIZE: "8"
  AVAGO_LOG_ROTATER_MAX_FILES: "2"
  AVAGO_LOG_ROTATER_MAX_AGE: "3"

services:
  v1:
    <<: *node
    environment: { <<: *env, AVAGO_STAKING_PORT: "9651", AVAGO_HTTP_ALLOWED_HOSTS: "*" }
    volumes: ["./v1:/root/.avalanchego", "./configs:/configs:ro"]
    ports: ["9651:9651"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.hk-ofel-v1.rule=Host(`ofel-v1.201-18-198-162.sslip.io`) && (Path(`/ext/info`) || PathPrefix(`/ext/health`) || Path(`/ext/bc/${OFEL_CHAIN_ID:-none}/rpc`) || Path(`/ext/bc/${OFEL_CHAIN_ID:-none}/ws`))
      - traefik.http.routers.hk-ofel-v1.entrypoints=https
      - traefik.http.routers.hk-ofel-v1.tls=true
      - traefik.http.routers.hk-ofel-v1.tls.certresolver=letsencrypt
      - traefik.http.services.hk-ofel-v1.loadbalancer.server.port=9650
  v2:
    <<: *node
    environment: { <<: *env, AVAGO_STAKING_PORT: "9653", AVAGO_HTTP_ALLOWED_HOSTS: "*" }
    volumes: ["./v2:/root/.avalanchego", "./configs:/configs:ro"]
    ports: ["9653:9653"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.hk-ofel-v2.rule=Host(`ofel-v2.201-18-198-162.sslip.io`) && (Path(`/ext/info`) || PathPrefix(`/ext/health`) || Path(`/ext/bc/${OFEL_CHAIN_ID:-none}/rpc`) || Path(`/ext/bc/${OFEL_CHAIN_ID:-none}/ws`))
      - traefik.http.routers.hk-ofel-v2.entrypoints=https
      - traefik.http.routers.hk-ofel-v2.tls=true
      - traefik.http.routers.hk-ofel-v2.tls.certresolver=letsencrypt
      - traefik.http.services.hk-ofel-v2.loadbalancer.server.port=9650
  v3:
    <<: *node
    environment: { <<: *env, AVAGO_STAKING_PORT: "9655", AVAGO_HTTP_ALLOWED_HOSTS: "*" }
    volumes: ["./v3:/root/.avalanchego", "./configs:/configs:ro"]
    ports: ["9655:9655"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.hk-ofel-v3.rule=Host(`ofel-v3.201-18-198-162.sslip.io`) && (Path(`/ext/info`) || PathPrefix(`/ext/health`) || Path(`/ext/bc/${OFEL_CHAIN_ID:-none}/rpc`) || Path(`/ext/bc/${OFEL_CHAIN_ID:-none}/ws`))
      - traefik.http.routers.hk-ofel-v3.entrypoints=https
      - traefik.http.routers.hk-ofel-v3.tls=true
      - traefik.http.routers.hk-ofel-v3.tls.certresolver=letsencrypt
      - traefik.http.services.hk-ofel-v3.loadbalancer.server.port=9650

  # Clearing agent: started only once deployments/fuji-l1.json exists (docker compose --profile agent up -d agent).
  agent:
    profiles: [agent]
    build: { context: ./app, dockerfile: deploy/vps/Dockerfile.agent }
    image: hk-ofel-agent:latest
    restart: unless-stopped
    networks: [coolify]
    mem_limit: 1g
    memswap_limit: 1500m
    cpus: 0.75
    env_file: [.env.agent]
    environment:
      OFEL_NETWORK: fuji-l1
      OFEL_PCHAIN_URL: https://api.avax-test.network/ext/bc/P
      OFEL_VALIDATOR_URIS: http://ofel-l1-v1-1:9650,http://ofel-l1-v2-1:9650,http://ofel-l1-v3-1:9650
      OFEL_SUBNET_ID: ${OFEL_SUBNET_ID:-}
      OFEL_BLOCKCHAIN_ID: ${OFEL_CHAIN_ID:-}
    volumes: ["./circuits:/app/web/public/circuits:ro"]
    depends_on: [v1, v2, v3]

networks:
  coolify:
    external: true
